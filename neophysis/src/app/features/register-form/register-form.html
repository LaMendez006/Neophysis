<div class="register-form">
  <header class="register-form__header">
    <h1 class="register-form__title">Crea tu cuenta</h1>
  </header>

  <form class="register-form__form" (ngSubmit)="false">
    <div class="register-form__row">
      <div class="register-form__field">
        <label class="register-form__label" for="firstName">Nombre</label>
        <input class="register-form__input" id="firstName" type="text" placeholder="Nombre" autocomplete="given-name" />
      </div>
      <div class="register-form__field">
        <label class="register-form__label" for="lastName">Apellido</label>
        <input class="register-form__input" id="lastName" type="text" placeholder="Apellido" autocomplete="family-name" />
      </div>
    </div>
    <div class="register-form__field">
      <label class="register-form__label" for="email">Correo electrónico</label>
      <input class="register-form__input" id="email" type="email" placeholder="jane.doe@lab.org" autocomplete="email" />
    </div>
    <div class="register-form__field">
      <label class="register-form__label" for="password">Contraseña</label>
      <input class="register-form__input" id="password" type="password" placeholder="Mín. 12 caracteres" autocomplete="new-password" />
    </div>
    <button class="register-form__submit" type="submit">Regístrate</button>
  </form>

  <footer class="register-form__footer">
    <a class="register-form__link" routerLink="/login">¿Ya tienes cuenta? Inicia sesión</a>
  </footer>
</div>
