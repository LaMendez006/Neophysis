<!-- @autor LaMendez -->

<div class="login-form">
  <header class="login-form__header">
    <h1 class="login-form__title">Iniciar Sesión</h1>
    <p class="login-form__subtitle">Ingresa a Neophysis</p>
  </header>

  <form [formGroup]="form" class="login-form__form" (ngSubmit)="submit()" [class.login-form__shake]="shake()">
    <div class="login-form__field">
      <label class="login-form__label" for="email">Correo electrónico</label>
      <input
        class="login-form__input"
        id="email"
        type="email"
        placeholder="jane.doe@lab.org"
        autocomplete="email"
        formControlName="email"
        [class.login-form__input--error]="getEmailError()"
      />
      <p class="login-form__message" [ngClass]="getEmailErrorClass()">{{ getEmailError() }}</p>
    </div>

    <div class="login-form__field login-form__field--password">
      <label class="login-form__label" for="password">Contraseña</label>
      <div class="login-form__password-row">
        <input
          class="login-form__input login-form__input--icon"
          id="password"
          [type]="showPassword() ? 'text' : 'password'"
          placeholder="Mín. 8 caracteres"
          autocomplete="current-password"
          formControlName="password"
          [class.login-form__input--error]="getPasswordError()"
        />
        <button class="login-form__eye" type="button" aria-label="Mostrar contraseña" (click)="togglePassword()">
          <span class="material-symbols-outlined">{{ showPassword() ? 'visibility_off' : 'visibility' }}</span>
        </button>
      </div>
      <p class="login-form__message" [ngClass]="getPasswordError() ? 'login-form__error' : ''">{{ getPasswordError() }}</p>
    </div>

    <div class="login-form__options">
      <label class="login-form__remember">
        <input type="checkbox" formControlName="remember" /> Recordarme
      </label>
    </div>

    <button class="login-form__submit" type="submit" [disabled]="isLoading()">
      <span *ngIf="isLoading()" class="login-form__spinner" aria-hidden="true"></span>
      <span *ngIf="isLoading()">Cargando...</span>
      <span *ngIf="!isLoading()">Iniciar Sesión</span>
    </button>

    <p *ngIf="loginError()" class="login-form__status login-form__status--error">{{ loginError() }}</p>
    <p *ngIf="loginSuccess()" class="login-form__status login-form__status--success">{{ loginSuccess() }}</p>
  </form>

  <footer class="login-form__footer">
    <a class="login-form__link" routerLink="/registro">¿No tienes cuenta? Regístrate</a>
  </footer>
</div>
