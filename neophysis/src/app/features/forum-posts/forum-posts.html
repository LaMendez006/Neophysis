<!-- @autor LaMendez -->
<section class="forum-posts">
  <div class="forum-posts__controls">
    <h2 class="forum-posts__heading">Sugerencias para ti</h2>
    <div class="forum-posts__sort">
      <button class="forum-posts__sort-btn" [class.forum-posts__sort-btn--active]="sort()==='reciente'" (click)="setSort('reciente')" type="button">Más Reciente</button>
      <button class="forum-posts__sort-btn" [class.forum-posts__sort-btn--active]="sort()==='popular'" (click)="setSort('popular')" type="button">Popular</button>
    </div>
  </div>

  <div class="forum-posts__list">
    @for (post of posts; track post.id) {
      <article class="post-card">
        <div class="post-card__votes">
          <button class="post-card__vote-btn post-card__vote-btn--up" type="button" aria-label="Votar a favor"><span class="material-symbols-outlined">expand_less</span></button>
          <span class="post-card__vote-count">{{ post.votes }}</span>
          <button class="post-card__vote-btn post-card__vote-btn--down" type="button" aria-label="Votar en contra"><span class="material-symbols-outlined">expand_more</span></button>
        </div>
        <div class="post-card__body">
          <div class="post-card__meta">
            <img class="post-card__avatar" [src]="post.avatar" [alt]="post.author" loading="lazy" />
            <span class="post-card__author">{{ post.author }}</span>
            <span class="post-card__time">• {{ post.time }}</span>
            <span class="post-card__category" [class.post-card__category--dark]="post.categoryDark">{{ post.category }}</span>
          </div>
          <h3 class="post-card__title">{{ post.title }}</h3>
          <p class="post-card__excerpt">{{ post.excerpt }}</p>
          <div class="post-card__actions">
            <button class="post-card__action" type="button"><span class="material-symbols-outlined">chat_bubble</span>{{ post.comments }} Comentarios</button>
            <button class="post-card__action" type="button"><span class="material-symbols-outlined">share</span>Compartir</button>
            <button class="post-card__action post-card__action--end" type="button" aria-label="Guardar"><span class="material-symbols-outlined">bookmark</span></button>
          </div>
        </div>
      </article>
    }
  </div>
</section>
