<!-- @autor LaMendez -->

<aside class="profile-card-wrap">

  <div class="profile-card">
    <div class="profile-card__banner" aria-hidden="true"></div>
    <div class="profile-card__body">
      <div class="profile-card__avatar-wrap">
        <img class="profile-card__avatar" [src]="user.avatarSrc" [alt]="user.name" loading="eager" />
      </div>
      <h1 class="profile-card__name">{{ user.name }}</h1>
      <p class="profile-card__title">{{ user.title }}</p>
      <p class="profile-card__bio">{{ user.bio }}</p>
      <div class="profile-card__stats">
        <div class="profile-card__stat">
          <span class="profile-card__stat-label">Publicaciones</span>
          <span class="profile-card__stat-value">{{ user.publications }}</span>
        </div>
        <div class="profile-card__stat">
          <span class="profile-card__stat-label">Comentarios</span>
          <span class="profile-card__stat-value">{{ user.comments }}</span>
        </div>
      </div>
      <button class="profile-card__edit-btn" type="button">
        <span class="material-symbols-outlined">edit</span>
        Editar Perfil
      </button>
    </div>
  </div>

  <div class="profile-info">
    <h3 class="profile-info__heading">Información</h3>
    <ul class="profile-info__list">
      <li class="profile-info__item">
        <span class="material-symbols-outlined profile-info__icon">location_on</span>
        <span>{{ user.location }}</span>
      </li>
      <li class="profile-info__item">
        <span class="material-symbols-outlined profile-info__icon">calendar_today</span>
        <span>Miembro desde {{ user.joinDate }}</span>
      </li>
      <li class="profile-info__item">
        <span class="material-symbols-outlined profile-info__icon">link</span>
        <a class="profile-info__link" href="#">{{ user.website }}</a>
      </li>
    </ul>
  </div>

</aside>
